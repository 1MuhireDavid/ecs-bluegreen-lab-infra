name: "Package nested templates to S3"

# This workflow does NOT deploy anything itself. Its only job is to get
# nested-stack template bodies into the S3 bucket that root.yaml's
# TemplateURL properties point at, then nudge Git sync (by bumping
# TemplatesVersion in deployment-file.yaml) so CloudFormation notices.
# Actual deployment stays 100% owned by CloudFormation Git sync.
on:
  push:
    branches: [main]
    paths:
      - "cfn/modules/**"
      - "cfn/root.yaml"
  workflow_dispatch: {}   # TEMPORARY -- lets the OIDC debug run be triggered on demand; remove with the debug step

permissions:
  id-token: write   # required for OIDC -> AWS
  contents: write    # required to commit the version bump back

concurrency:
  group: package-templates
  cancel-in-progress: false

jobs:
  package-and-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TEMPORARY -- diagnosing an OIDC "Not authorized to perform
      # sts:AssumeRoleWithWebIdentity" error that persists despite the
      # role's trust policy and the OIDC provider both checking out
      # correctly via `aws iam get-role` / `get-open-id-connect-provider`.
      # Prints the actual claims GitHub is putting in the ID token so they
      # can be diffed against the trust policy's sub/job_workflow_ref
      # conditions. Remove this step once the mismatch is found.
      - name: Debug OIDC token claims
        run: |
          IDTOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$IDTOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_PACKAGING_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Compute template version (short SHA)
        id: version
        run: echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload nested templates to S3
        run: |
          aws s3 cp "cfn/modules/" \
            "s3://${{ secrets.AWS_TEMPLATES_BUCKET }}/templates/${{ steps.version.outputs.sha }}/" \
            --recursive --exclude "*" --include "*.yaml"

      - name: Bump TemplatesVersion in deployment-file.yaml
        run: |
          sed -i \
            "s/^  TemplatesVersion:.*/  TemplatesVersion: ${{ steps.version.outputs.sha }}/" \
            "cfn/deployment-file.yaml"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "cfn/deployment-file.yaml"
          if ! git diff --cached --quiet; then
            git commit -m "chore: point Git sync at templates ${{ steps.version.outputs.sha }} [skip ci]"
            git push
          else
            echo "No version change to commit."
          fi
